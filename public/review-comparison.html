<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OOCA — ชุดดาว SVG ใหม่</title>
<style>body{font:16px system-ui;margin:24px;background:#e0f1ee;color:#283943}main{max-width:1100px;margin:auto}.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}figure{margin:0;background:#fff8;padding:12px;border-radius:16px;text-align:center}img{width:100%;aspect-ratio:1;object-fit:contain}figcaption{margin-top:8px;font-size:14px}a{color:#1765c4}.dark figure{background:#30495d}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px}h2{font-size:20px;margin-top:32px}button{padding:10px 18px;border-radius:20px;border:1px solid #637b91}.icons{display:flex;gap:20px;margin:16px 0}.icons img{width:28px;height:28px}@media(max-width:500px){body{margin:12px}.stages{gap:4px}figure{padding:4px}figcaption{font-size:11px}}</style>
<main><h1>ชุดดาว SVG ใหม่จาก Figma</h1><p>6 อารมณ์ × 4 ขั้น · เวกเตอร์โปร่งใส ไม่มี PNG ฝัง</p><p><a href="/">เปิดเว็บตัวอย่าง</a></p><button onclick="document.body.classList.toggle('dark')">สลับพื้นเข้มเพื่อตรวจขอบ</button><h2>เปรียบเทียบดาวคลี่</h2><div class="compare"><figure><img src="/assets/star-tired-3.png" alt="ดาวคลี่เดิม"><figcaption>ภาพเดิม</figcaption></figure><figure><img src="/assets/paper-tired-3.svg" alt="ดาวคลี่ใหม่"><figcaption>SVG ใหม่จาก Figma</figcaption></figure></div><div id="stars"></div><h2>ไอคอนขนาดใช้งาน 28 px</h2><div id="icons" class="icons"></div></main>
<script>
const emotions={tired:'เหนื่อยมาก',gloomy:'หม่น ๆ',lonely:'เหงา',heavy:'หนักใจ',unsure:'บอกไม่ถูก',okay:'โอเคอยู่'};
const stages=['01 พับแล้ว','02 เริ่มคลี่','03 กำลังคลี่','04 คลี่แล้ว'];
for(const [id,label] of Object.entries(emotions)){
 const section=document.createElement('section');const h=document.createElement('h2');h.textContent=label;section.append(h);
 const grid=document.createElement('div');grid.className='stages';
 stages.forEach((name,step)=>{const figure=document.createElement('figure');const img=document.createElement('img');img.src='/assets/paper-'+id+'-'+step+'.svg';img.alt=label+' '+name;const caption=document.createElement('figcaption');caption.textContent=name;figure.append(img,caption);grid.append(figure);});
 section.append(grid);document.querySelector('#stars').append(section);
 const icon=document.createElement('img');icon.src='/assets/paper-'+id+'-0.svg';icon.alt=label;document.querySelector('#icons').append(icon);
}
</script></html>
